<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="description" content="Luxe digitale klok met datum en weer. Scherm blijft aan." />
  <title>Luxe Klok</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app" class="app" aria-live="polite">
    <div class="glow glow-a" aria-hidden="true"></div>
    <div class="glow glow-b" aria-hidden="true"></div>
    <div class="vignette" aria-hidden="true"></div>

    <header class="top-bar">
      <div class="weather" id="weather" title="Tik om weer te verversen">
        <span class="weather-icon" id="weatherIcon">···</span>
        <span class="weather-temp" id="weatherTemp">--°</span>
        <span class="weather-desc" id="weatherDesc">Weer laden…</span>
      </div>
      <button type="button" class="btn-icon" id="btnSettings" aria-label="Instellingen" title="Instellingen">⚙</button>
    </header>

    <main class="stage">
      <div class="time-block">
        <div class="time" id="time">00:00</div>
        <div class="seconds" id="seconds">00</div>
      </div>
      <div class="divider" aria-hidden="true"></div>
      <div class="date" id="date">—</div>
      <div class="weekday" id="weekday">—</div>
    </main>

    <footer class="bottom-bar">
      <div class="palette-dot" id="paletteDot" title="Huidige kleuren"></div>
      <div class="status" id="status">Scherm aan houden…</div>
      <button type="button" class="btn-text" id="btnFullscreen">Volledig scherm</button>
    </footer>
  </div>

  <dialog id="settings" class="settings">
    <form method="dialog" class="settings-card">
      <h2>Instellingen</h2>

      <label class="field">
        <span>Plaats (voor weer)</span>
        <input type="text" id="cityInput" placeholder="Bijv. Amsterdam" autocomplete="address-level2" />
      </label>

      <label class="field row">
        <span>Seconden tonen</span>
        <input type="checkbox" id="showSeconds" checked />
      </label>

      <label class="field row">
        <span>24-uurs klok</span>
        <input type="checkbox" id="use24h" checked />
      </label>

      <label class="field row">
        <span>Scherm altijd aan</span>
        <input type="checkbox" id="keepAwake" checked />
      </label>

      <p class="hint">Kleuren wisselen automatisch elk half uur. Tik ergens op het scherm als het dimt.</p>

      <div class="settings-actions">
        <button type="submit" class="btn-primary" value="ok">Klaar</button>
        <button type="button" class="btn-ghost" id="btnLocate">GPS-locatie</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
